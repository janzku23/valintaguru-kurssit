name: ValintaGuru - versionumeron paivitys

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valintaguru-version-main
  cancel-in-progress: false

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Hae projektin tiedostot
        uses: actions/checkout@v4

      - name: Asenna Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Etsi tiedosto ja kasvata versionumero
        id: update
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find . -type f -path '*/data/siteVersion.json' \
            -not -path '*/node_modules/*' -not -path '*/.next/*' -not -path '*/.git/*')
          if [[ ${#candidates[@]} -ne 1 ]]; then
            printf 'Virhe: odotettiin tasan yhta data/siteVersion.json-tiedostoa, loytyi %s.\n' "${#candidates[@]}"
            printf 'Loydetyt tiedostot:\n'
            find . -name siteVersion.json -not -path '*/node_modules/*' -print
            exit 1
          fi
          version_file="${candidates[0]}"
          echo "version_file=$version_file" >> "$GITHUB_OUTPUT"
          node - "$version_file" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const obj = JSON.parse(fs.readFileSync(file, 'utf8'));
          const match = /^(\d+)\.(\d)\.(\d)$/.exec(obj.version);
          if (!match) throw new Error(`Virheellinen versionumero: ${obj.version}`);
          let [major, minor, patch] = match.slice(1).map(Number);
          patch += 1;
          if (patch === 10) { patch = 0; minor += 1; }
          if (minor === 10) { minor = 0; major += 1; }
          obj.version = `${major}.${minor}.${patch}`;
          fs.writeFileSync(file, JSON.stringify(obj, null, 2) + '\n');
          console.log(`Uusi versio: ${obj.version} (${file})`);
          NODE

      - name: Tallenna versio GitHubiin
        shell: bash
        env:
          VERSION_FILE: ${{ steps.update.outputs.version_file }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$VERSION_FILE"
          git commit -m 'chore: paivita ValintaGurun versionumero'
          git push origin HEAD:main
